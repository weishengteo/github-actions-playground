name: PR Check

on:
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"
            
            - name: Run Python
              run: python hello.py

            - name: Check git status
              run: git status
            
            - name: Show recent commits
              run: git log --oneline -n 5